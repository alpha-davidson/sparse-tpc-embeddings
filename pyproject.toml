[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sparse-tpc"
version = "2.0.0"
description = "Sparse ResNet and PointNet-style embeddings of TPC data (arXiv:2608.21756)"
license = {text = "MIT"}
requires-python = ">=3.8"

[tool.setuptools]
packages = ["sparse_tpc"]
